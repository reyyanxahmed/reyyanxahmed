<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="135" height="40" viewBox="0 0 135 40" fill="none" role="img" aria-label="linkedin"><title>linkedin</title><style>@font-face{font-family:'G';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'GM';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}
.s{font-family:'G',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.m{font-family:'GM',ui-monospace,SFMono-Regular,Menlo,monospace}
.u{text-transform:uppercase}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ping{0%{transform:scale(1);opacity:.8}75%,100%{transform:scale(3.2);opacity:0}}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.1s cubic-bezier(.2,.8,.2,1) .15s both}
.cur{animation:blink 1.06s steps(1) infinite}
.png{transform-box:fill-box;transform-origin:center;animation:ping 2s cubic-bezier(0,.6,.4,1) infinite}

@keyframes nudge{0%,70%,100%{transform:translate(0,0)}80%{transform:translate(3px,-3px)}}
.ar{animation:nudge 3s cubic-bezier(.2,.8,.2,1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="134" height="39" fill="#0b0b0d" stroke="#64646b"/><text x="18" y="25" class="m u" font-size="12" letter-spacing=".14em" fill="#fafaf7">linkedin</text><g class="ar" style="animation-delay:0.00s"><path class="" d="M105 24L114 15M107.7 15H114V21.3" stroke="#a9a7ff" stroke-width="1.4" stroke-linecap="square"/></g></svg>