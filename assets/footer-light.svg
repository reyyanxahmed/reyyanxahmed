<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="130" viewBox="0 0 1000 130" fill="none" role="img" aria-label="end of transmission"><title>end of transmission</title><style>@font-face{font-family:'G';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'GM';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}
.s{font-family:'G',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
