<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="46" viewBox="0 0 1000 46" fill="none" role="img" aria-label="05 selected work"><title>05 selected work</title><style>@font-face{font-family:'G';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'GM';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}
.s{font-family:'G',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.m{font-family:'GM',ui-monospace,SFMono-Regular,Menlo,monospace}
.u{text-transform:uppercase}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes growx{from{transform:scaleX(0)}}
